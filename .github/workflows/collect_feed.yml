name: Collect OpenPhish feed

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, UTC
  workflow_dispatch: {}      # lets you start it by hand

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download feed
        run: |
          mkdir -p data/feed
          STAMP=$(date -u +%Y%m%d_%H%M)
          OUT="data/feed/openphish_${STAMP}.txt"
          curl -fsSL --max-time 60 -A "academic-phishing-research" https://openphish.com/feed.txt -o "$OUT"
          LINES=$(wc -l < "$OUT")
          BAD=$(grep -v '^$' "$OUT" | grep -vc '^https\?://' || true)
          echo "lines=$LINES, non-URL lines=$BAD"
          if [ "$LINES" -lt 20 ] || [ "$BAD" -gt 0 ]; then
            echo "Feed looks invalid (not a URL list); not saving."
            rm -f "$OUT"
            exit 1
          fi
      - name: Commit snapshot
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add data/feed
          git commit -m "feed snapshot" || echo "nothing to commit"
          git pull --rebase
          git push
